<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espresso 1:2</title>
<meta name="description" content="Carnet de shots d'espresso et conseils pour viser un ratio 1:2.">
<meta name="theme-color" content="#3b2418">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ---------- Couleurs (clair / sombre automatique) ---------- */
:root {
  --bg: #f6efe6; --surface: #fffaf3; --surface2: #efe3d3; --line: #e2d3c0;
  --text: #2b1d14; --muted: #7a6656; --accent: #7b4a2a; --accent-ink: #fff;
  --good: #2f7d4f; --good-bg: #dcefe2; --warn: #b8650f; --warn-bg: #f8e6cf;
  --bad: #b3412f; --zone: #bfe0c9; --track: #e8dccb;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16100c; --surface: #221913; --surface2: #2f241c; --line: #3c2f25;
    --text: #f3e7d8; --muted: #b29c88; --accent: #d9a671; --accent-ink: #1d130c;
    --good: #67c48f; --good-bg: #1d3326; --warn: #eaa452; --warn-bg: #3a2914;
    --bad: #e8806e; --zone: #2c5039; --track: #3a2e25;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-bottom: calc(76px + env(safe-area-inset-bottom));
  overscroll-behavior-y: contain;
}
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* ---------- En-tête ---------- */
header {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 8px;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: var(--bg);
  border-bottom: 1px solid var(--line);
}
header h1 { font-size: 19px; margin: 0; flex: 1; letter-spacing: .2px; }
.pill {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 7px 12px; font-size: 13px; white-space: nowrap;
}
.pill.ok { color: var(--good); }
.pill.wait { color: var(--warn); }
.pill.err { color: var(--bad); }
.iconbtn { border: 0; background: none; font-size: 22px; padding: 4px 6px; color: var(--muted); }

main { padding: 12px 16px 24px; max-width: 560px; margin: 0 auto; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 12px; }
.label { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin: 0 0 8px; }

/* ---------- Cartes "meilleur réglage" ---------- */
.carousel { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px 12px; padding: 0 16px 4px; scrollbar-width: none; }
.carousel::-webkit-scrollbar { display: none; }
.best {
  flex: 0 0 82%; scroll-snap-align: start; text-align: left; border: 1px solid var(--line);
  background: var(--surface); border-radius: 18px; padding: 12px 14px;
}
.best.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.best h3 { margin: 0 0 2px; font-size: 16px; }
.best .reco { font-size: 15px; margin: 6px 0; }
.best .reco b { font-size: 17px; }
.best .stats { display: flex; gap: 12px; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.sparks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.spark .t { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
.spark svg { display: block; width: 100%; height: 34px; }

/* ---------- Puces café ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line); background: var(--surface2); border-radius: 999px;
  padding: 10px 14px; font-size: 15px; min-height: 44px;
}
.chip.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.chip.add { background: none; border-style: dashed; color: var(--muted); }
.linkbtn { border: 0; background: none; color: var(--accent); padding: 8px 0 0; font-size: 14px; }

/* ---------- Steppers ---------- */
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.row + .row { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.row .name { font-weight: 600; }
.row .sub { font-size: 13px; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button, .bigstep {
  width: 56px; height: 56px; border-radius: 16px; border: 0; background: var(--surface2);
  font-size: 28px; line-height: 1; user-select: none; -webkit-user-select: none;
}
.stepper button:active, .bigstep:active { background: var(--line); }
.stepper .val { min-width: 84px; text-align: center; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stepper .val small { font-size: 14px; font-weight: 500; color: var(--muted); }

.timebox { display: flex; align-items: center; justify-content: space-between; }
.bigstep { width: 68px; height: 68px; border-radius: 50%; }
.bignum { font-size: 64px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; text-align: center; }
.bignum small { font-size: 22px; font-weight: 600; color: var(--muted); }
input[type=range] { width: 100%; margin: 16px 0 2px; accent-color: var(--accent); height: 32px; }
.rangescale { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

.liveratio { text-align: center; font-size: 15px; margin-top: 12px; color: var(--muted); }
.liveratio b { color: var(--text); font-size: 18px; }

.taste { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.taste button {
  min-height: 60px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface2);
  font-size: 16px; font-weight: 600;
}
.taste button.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
textarea, input[type=text], input[type=date] {
  width: 100%; font: inherit; color: var(--text); background: var(--surface2); border: 1px solid var(--line);
  border-radius: 12px; padding: 12px; resize: vertical;
}
.savebar { position: sticky; bottom: calc(76px + env(safe-area-inset-bottom)); padding-top: 6px; z-index: 5; }
.primary {
  width: 100%; min-height: 60px; border: 0; border-radius: 18px; background: var(--accent); color: var(--accent-ink);
  font-size: 18px; font-weight: 700; box-shadow: 0 6px 18px rgb(0 0 0 / .18);
}
.primary:active { transform: scale(.99); }
.secondary {
  width: 100%; min-height: 52px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface2);
  font-size: 16px; font-weight: 600;
}
.danger { color: var(--bad); }
.primary.danger { background: var(--bad); color: #fff; }
.banner { background: var(--warn-bg); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; font-size: 14px; }
.banner .secondary { margin-top: 10px; }
.tip { font-size: 13px; color: var(--muted); text-align: center; padding: 8px 8px 0; }

/* ---------- Onglets ---------- */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: 1fr 1fr;
  background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
}
nav.tabs button { border: 0; background: none; height: 64px; font-size: 15px; font-weight: 600; color: var(--muted); }
nav.tabs button span { display: block; font-size: 20px; line-height: 1.1; }
nav.tabs button.sel { color: var(--accent); }

/* ---------- Historique ---------- */
.histhead { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.histhead .chips { flex: 1; }
.shot { padding: 12px 14px; }
.shot .top { display: flex; justify-content: space-between; gap: 8px; }
.shot .top b { font-size: 16px; }
.shot .vals { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
.shot .note { font-style: italic; color: var(--muted); font-size: 14px; margin-top: 4px; }
.shot .acts { display: flex; gap: 8px; margin-top: 8px; }
.shot .acts button { flex: 1; min-height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); font-size: 14px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }
.dot.ok { background: var(--good); } .dot.warn { background: var(--warn); }
.empty { text-align: center; color: var(--muted); padding: 32px 16px; }

/* ---------- Résultat ---------- */
.overlay { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
.overlay .inner { max-width: 560px; margin: 0 auto; }
.overlay h2 { margin: 4px 0 12px; font-size: 22px; }
.metric { display: flex; justify-content: space-between; align-items: baseline; }
.metric .v { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
.status { font-size: 14px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
.status.ok { color: var(--good); background: var(--good-bg); }
.status.warn { color: var(--warn); background: var(--warn-bg); }
.gauge { position: relative; height: 14px; border-radius: 7px; background: var(--track); margin: 10px 0 4px; }
.gauge .zone { position: absolute; top: 0; bottom: 0; background: var(--zone); border-radius: 7px; }
.gauge .mark { position: absolute; top: -5px; width: 8px; height: 24px; margin-left: -4px; border-radius: 4px; border: 2px solid var(--surface); }
.gauge .mark.ok { background: var(--good); } .gauge .mark.warn { background: var(--warn); }
.gscale { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.onlyone { background: var(--accent); color: var(--accent-ink); border-radius: 14px; padding: 12px 14px; font-weight: 600; margin-bottom: 12px; }
.advice { counter-reset: a; list-style: none; padding: 0; margin: 0; }
.advice li { position: relative; padding: 0 0 12px 36px; }
.advice li + li { padding-top: 12px; border-top: 1px solid var(--line); }
.advice li::before {
  counter-increment: a; content: counter(a); position: absolute; left: 0; width: 26px; height: 26px; border-radius: 50%;
  background: var(--surface2); text-align: center; line-height: 26px; font-weight: 700; font-size: 14px;
}
.advice li + li::before { top: 12px; }
.advice b { display: block; }
.advice .tag { font-size: 12px; color: var(--muted); }
.recipe { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; margin-bottom: 12px; }
.recipe div { background: var(--surface2); border-radius: 12px; padding: 10px 4px; }
.recipe b { display: block; font-size: 20px; }
.recipe span { font-size: 12px; color: var(--muted); }

/* ---------- Dialogues / toast ---------- */
dialog {
  border: 0; border-radius: 22px; padding: 18px; width: min(92vw, 440px); background: var(--surface); color: var(--text);
}
dialog::backdrop { background: rgb(0 0 0 / .45); }
dialog h3 { margin: 0 0 10px; font-size: 18px; }
dialog .btns { display: flex; gap: 8px; margin-top: 16px; }
dialog .btns button { flex: 1; }
dialog .field { margin-top: 12px; }
dialog .field > div:first-child { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
dialog ul { padding-left: 20px; margin: 6px 0; }
.toast {
  position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 50;
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: 90vw;
  opacity: 0; transition: opacity .2s; pointer-events: none;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>Espresso 1:2</h1>
  <button id="syncPill" class="pill">…</button>
  <button id="menuBtn" class="iconbtn" aria-label="Réglages">⋯</button>
</header>

<!-- ============ Onglet Shot ============ -->
<main id="tabShot">
  <div id="setupBanner" class="banner hidden"></div>

  <div id="carousel" class="carousel"></div>

  <div id="editBanner" class="banner hidden">
    <b>Modification</b> du shot <span id="editWhen"></span>
    <button class="secondary" id="cancelEdit">Annuler la modification</button>
  </div>

  <section class="card">
    <p class="label">Café</p>
    <div id="cafeChips" class="chips"></div>
    <button id="editCafeBtn" class="linkbtn">Modifier ce café</button>
  </section>

  <section class="card">
    <div class="row">
      <div><div class="name">Dose</div><div class="sub">grammes de café moulu</div></div>
      <div class="stepper"><button data-step="dose:-1" aria-label="Moins">−</button><div class="val" id="vDose"></div><button data-step="dose:1" aria-label="Plus">+</button></div>
    </div>
    <div class="row">
      <div><div class="name">Mouture K6</div><div class="sub" id="vTours"></div></div>
      <div class="stepper"><button data-step="clics:-1" aria-label="Moins">−</button><div class="val" id="vClics"></div><button data-step="clics:1" aria-label="Plus">+</button></div>
    </div>
  </section>

  <section class="card">
    <p class="label">Temps d'extraction</p>
    <div class="timebox">
      <button class="bigstep" data-step="temps:-1" aria-label="Moins une seconde">−</button>
      <div class="bignum" id="vTemps"></div>
      <button class="bigstep" data-step="temps:1" aria-label="Plus une seconde">+</button>
    </div>
    <input type="range" id="tempsRange" min="10" max="60" step="1" aria-label="Temps en secondes">
    <div class="rangescale"><span>10 s</span><span>cible 25–30 s</span><span>60 s</span></div>
  </section>

  <section class="card">
    <div class="row">
      <div><div class="name">En tasse</div><div class="sub">grammes de boisson</div></div>
      <div class="stepper"><button data-step="tasse:-1" aria-label="Moins">−</button><div class="val" id="vTasse"></div><button data-step="tasse:1" aria-label="Plus">+</button></div>
    </div>
    <div class="liveratio">Ratio <b id="vRatio"></b> <span id="vRatioHint"></span></div>
  </section>

  <section class="card">
    <p class="label">Goût <span class="muted" style="text-transform:none;letter-spacing:0">(optionnel)</span></p>
    <div class="taste" id="tasteBtns">
      <button data-gout="acide">Acide</button>
      <button data-gout="équilibré">Équilibré</button>
      <button data-gout="amer">Amer</button>
    </div>
    <p class="label" style="margin-top:14px">Note <span class="muted" style="text-transform:none;letter-spacing:0">(optionnelle)</span></p>
    <textarea id="note" rows="2" placeholder="Ex. crema épaisse, après vapeur…"></textarea>
  </section>

  <div class="savebar"><button class="primary" id="saveBtn">Enregistrer le shot</button></div>
  <p class="tip" id="formTip"></p>
</main>

<!-- ============ Onglet Historique ============ -->
<main id="tabHist" class="hidden">
  <div class="histhead">
    <div class="chips" id="histFilter"></div>
  </div>
  <button class="secondary" id="csvBtn" style="margin-bottom:12px">Exporter en CSV</button>
  <div id="histList"></div>
</main>

<nav class="tabs">
  <button id="tabBtnShot" class="sel"><span>☕</span>Shot</button>
  <button id="tabBtnHist"><span>☰</span>Historique</button>
</nav>

<!-- ============ Résultat après enregistrement ============ -->
<div id="result" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Résultat du shot">
  <div class="inner" id="resultInner"></div>
</div>

<dialog id="dlg"></dialog>
<div id="toast" class="toast"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
<script>
/* =====================================================================
   1. À REMPLIR : identifiants Google Cloud (voir README)
   ===================================================================== */
const CLIENT_ID = ''; // ex. '123456789012-abc123.apps.googleusercontent.com'
const API_KEY   = ''; // ex. 'AIzaSy...'

/* =====================================================================
   2. Constantes
   ===================================================================== */
const SCOPE = 'https://www.googleapis.com/auth/drive.file';
const SHEETS = 'https://sheets.googleapis.com/v4/spreadsheets';
const HEADER = ['id', 'date', 'heure', 'cafe', 'torrefaction', 'dose_g', 'tasse_g', 'ratio', 'temps_s', 'clics_k6', 'gout', 'note'];
const CAFES_TAB = 'cafes';
const CAFES_HEADER = ['nom', 'torrefaction', 'date_torrefaction'];
const DEFAULT_CAFES = [
  { nom: 'Lavazza Qualità Oro', torrefaction: 'moyenne', date: '' },
  { nom: 'Meo Bio', torrefaction: 'moyenne', date: '' },
  { nom: 'Porje Mexique', torrefaction: 'moyenne', date: '' },
];
const TIME_LO = 25, TIME_HI = 30;
const PREINF = 6; // secondes approximatives avant les premières gouttes (sert à estimer le temps à 1:2)

/* =====================================================================
   3. Stockage local (copie sur le téléphone)
   ===================================================================== */
const load = (k, d) => { try { const v = localStorage.getItem('es.' + k); return v ? JSON.parse(v) : d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem('es.' + k, JSON.stringify(v)); } catch {} };

let cafes = load('cafes', DEFAULT_CAFES);
let shots = load('shots', []);       // copie locale de la feuille
let queue = load('queue', []);       // opérations en attente d'envoi
let next = load('next', {});         // "prochaine recette" par café
let S = load('settings', { sheetId: '', sheetName: '', cafe: '', tipIdx: 0 });
const saveAll = () => { save('cafes', cafes); save('shots', shots); save('queue', queue); save('next', next); save('settings', S); };

/* =====================================================================
   4. Petits utilitaires
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, '0');
const fr = (n, d = 1) => Number(n).toFixed(d).replace('.', ',');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
const isTmp = (id) => String(id).startsWith('tmp-');
const ratioOf = (s) => (s.dose > 0 ? s.tasse / s.dose : 0);
const sortKey = (s) => `${s.date} ${s.heure}`;
const tours = (c) => { const t = Math.floor(c / 60), r = c % 60; return `${t} tour${t > 1 ? 's' : ''} ${r}`; };
const dateFr = (d) => (d ? d.slice(8, 10) + '/' + d.slice(5, 7) : '');
const roastLabel = { claire: 'claire', moyenne: 'moyenne', foncee: 'foncée' };
const goutLabel = { acide: 'Acide', equilibre: 'Équilibré', amer: 'Amer' };

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600);
}

// Cible de ratio selon la torréfaction
function profile(roast) {
  const r = norm(roast);
  if (r === 'claire') return { lo: 1.8, hi: 2.5, target: 2.0, light: true };
  if (r === 'foncee') return { lo: 1.8, hi: 2.0, target: 1.9, dark: true };
  return { lo: 1.8, hi: 2.2, target: 2.0 };
}
const cafeByName = (n) => cafes.find((c) => c.nom === n);
const roastOf = (shot) => shot.torrefaction || cafeByName(shot.cafe)?.torrefaction || 'moyenne';
const inTarget = (s) => { const p = profile(roastOf(s)), R = ratioOf(s); return R >= p.lo && R <= p.hi && s.temps >= TIME_LO && s.temps <= TIME_HI; };
const shotsOf = (cafe) => shots.filter((s) => s.cafe === cafe).sort((a, b) => sortKey(a).localeCompare(sortKey(b)));

/* =====================================================================
   5. Formulaire de saisie
   ===================================================================== */
const F = { cafe: '', dose: 180, clics: 30, temps: 28, tasse: 36, gout: '', note: '' }; // dose en dixièmes de gramme
let editingId = null;

function prefill(cafe) {
  F.cafe = cafe; S.cafe = cafe;
  const rec = next[cafe];
  const last = shotsOf(cafe).at(-1);
  const src = rec || last;
  if (src) {
    F.dose = Math.round(src.dose * 10); F.clics = src.clics; F.tasse = Math.round(src.tasse);
    F.temps = rec ? 28 : src.temps;
  } else { F.dose = 180; F.clics = 30; F.temps = 28; F.tasse = 36; }
  F.gout = ''; F.note = ''; $('note').value = '';
  save('settings', S);
}

function step(field, dir) {
  if (field === 'dose') { F.dose = clamp(F.dose + dir, 0, 300); F.tasse = Math.round(F.dose / 10 * 2); }
  if (field === 'clics') F.clics = clamp(F.clics + dir, 0, 180);
  if (field === 'temps') F.temps = clamp(F.temps + dir, 1, 120);
  if (field === 'tasse') F.tasse = clamp(F.tasse + dir, 0, 150);
  renderForm();
}

// Appui long = défilement rapide (qui accélère)
function bindRepeat(btn, fn) {
  let t; const stop = () => clearTimeout(t);
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault(); fn(); let delay = 350;
    const loop = () => { fn(); delay = Math.max(30, delay * 0.75); t = setTimeout(loop, delay); };
    t = setTimeout(loop, delay);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => btn.addEventListener(ev, stop));
  btn.addEventListener('contextmenu', (e) => e.preventDefault());
  btn.addEventListener('click', (e) => { if (e.detail === 0) fn(); }); // clavier
}

function renderForm() {

    `<button class="chip ${c.nom === F.cafe ? 'sel' : ''}" data-cafe="${esc(c.nom)}">${esc(c.nom)}</button>`).join('') +
    `<button class="chip add" id="addCafe">+ Ajouter un café</button>`;

  $('editCafeBtn').textContent = `Modifier « ${F.cafe} »`;
  $('vDose').innerHTML = `${fr(F.dose / 10)}<small> g</small>`;
  $('vClics').innerHTML = `${F.clics}<small> clics</small>`;
  $('vTours').textContent = `${tours(F.clics)} · ${F.clics * 16} µm`;
  $('vTemps').innerHTML = `${F.temps}<small> s</small>`;
  $('tempsRange').value = clamp(F.temps, 10, 60);
  $('vTasse').innerHTML = `${F.tasse}<small> g</small>`;

  const p = profile(cafeByName(F.cafe)?.torrefaction);

  document.querySelectorAll('#tasteBtns button').forEach((b) => b.classList.toggle('sel', b.dataset.gout === F.gout));
  $('saveBtn').textContent = editingId ? 'Enregistrer la modification' : 'Enregistrer le shot';
  $('editBanner').classList.toggle('hidden', !editingId);

/* ---------- Ajout / modification d'un café ---------- */
function cafeDialog(existing) {
  const c = existing || { nom: '', torrefaction: 'moyenne', date: '' };
  let roast = norm(c.torrefaction) || 'moyenne';
  const d = $('dlg');
  d.innerHTML = `
    <h3>${existing ? 'Modifier le café' : 'Nouveau café'}</h3>
    <div class="field"><div>Nom</div><input type="text" id="cNom" value="${esc(c.nom)}" autocomplete="off"></div>
    <div class="field"><div>Torréfaction</div>
      <div class="taste" id="cRoast">${['claire', 'moyenne', 'foncee'].map((r) => `<button type="button" data-r="${r}">${roastLabel[r]}</button>`).join('')}</div></div>
    <div class="field"><div>Date de torréfaction (optionnelle)</div><input type="date" id="cDate" value="${esc(c.date)}"></div>
    <div class="btns"><button class="secondary" id="cCancel">Annuler</button><button class="primary" id="cOk">Enregistrer</button></div>
    ${existing ? '<div class="btns"><button class="secondary danger" id="cDel">Supprimer ce café</button></div>' : ''}`;
  const paint = () => d.querySelectorAll('#cRoast button').forEach((b) => b.classList.toggle('sel', b.dataset.r === roast));
  d.querySelectorAll('#cRoast button').forEach((b) => b.onclick = () => { roast = b.dataset.r; paint(); });
  paint();
  $('cCancel').onclick = () => d.close();
  $('cOk').onclick = () => {
    const nom = $('cNom').value.trim();
    if (!nom) return toast('Donne un nom au café.');
    if (cafes.some((x) => x.nom === nom && x !== existing)) return toast('Ce café existe déjà.');
    const item = { nom, torrefaction: roastLabel[roast], date: $('cDate').value };
    if (existing) {
      const old = existing.nom;
      Object.assign(existing, item);
      if (old !== nom) { // on renomme aussi les shots de ce café
        shots.filter((s) => s.cafe === old).forEach((s) => { s.cafe = nom; qUpdate(s.id); });
        if (next[old]) { next[nom] = next[old]; delete next[old]; }
        if (F.cafe === old) F.cafe = S.cafe = nom;
      }
    } else { cafes.push(item); prefill(nom); }
    qCafes(); saveAll(); d.close(); renderAll(); syncSoon();
  };
  if (existing) $('cDel').onclick = async () => {
    d.close();
    if (!(await ask({ title: `Supprimer « ${existing.nom} » ?`, body: 'Les shots déjà enregistrés de ce café sont conservés.', ok: 'Supprimer', danger: true }))) return;
    cafes = cafes.filter((x) => x !== existing);
    if (F.cafe === existing.nom) prefill(cafes[0]?.nom || '');
    qCafes(); saveAll(); renderAll(); syncSoon();
  };
  d.showModal();
}

/* ---------- Dialogue de confirmation ---------- */
function ask({ title, body = '', ok = 'Confirmer', cancel = 'Annuler', danger = false }) {
  return new Promise((res) => {
    const d = $('dlg');
    d.innerHTML = `<h3>${title}</h3><div>${body}</div>
      <div class="btns">${cancel ? `<button class="secondary" id="aNo">${cancel}</button>` : ''}<button class="primary ${danger ? 'danger' : ''}" id="aOk">${ok}</button></div>`;
    const done = (v) => { d.onclose = null; d.close(); res(v); };
    $('aOk').onclick = () => done(true);
    if (cancel) $('aNo').onclick = () => done(false);
    d.onclose = () => res(false);
    d.showModal();
  });
}

/* ---------- Enregistrement ---------- */
async function onSave() {
  if (!F.cafe) return ask({ title: 'Choisis un café', body: 'Sélectionne ou ajoute un café avant d’enregistrer.', ok: 'OK', cancel: '' });
  const dose = F.dose / 10;
  if (dose <= 0) return ask({ title: 'Dose à 0 g', body: 'La dose ne peut pas être 0 g. Corrige-la avant d’enregistrer.', ok: 'OK', cancel: '' });
  const R = F.tasse / dose, issues = [];
  if (R < 1) issues.push(`Ratio 1:${fr(R)}, inférieur à 1:1.`);
  if (R > 4) issues.push(`Ratio 1:${fr(R)}, supérieur à 1:4.`);
  if (F.temps > 60) issues.push(`Temps de ${F.temps} s, au-delà de 60 s.`);
  if (issues.length && !(await ask({ title: 'Tu confirmes ?', body: `<ul>${issues.map((i) => `<li>${i}</li>`).join('')}</ul>Ces valeurs sont inhabituelles.`, ok: 'Oui, enregistrer' }))) return;

  const cafe = cafeByName(F.cafe);
  const data = { cafe: F.cafe, torrefaction: cafe?.torrefaction || '', dose, tasse: F.tasse, temps: F.temps, clics: F.clics, gout: F.gout, note: $('note').value.trim() };

  if (editingId) {
    const s = shots.find((x) => String(x.id) === String(editingId));
    if (s) { Object.assign(s, data); qUpdate(s.id); }
    editingId = null; saveAll(); prefill(F.cafe); renderAll();
    toast('Shot modifié'); syncNow(); showTab('hist');
    return;
  }
  const shot = { id: 'tmp-' + Date.now().toString(36), date: today(), heure: nowHM(), ...data };
  const prev = shotsOf(F.cafe);
  shots.push(shot); qAdd(shot.id);
  delete next[F.cafe];
  saveAll();
  syncNow(); // on tente l'envoi tout de suite (dans le geste du doigt, pour la connexion Google si besoin)
  showResult(shot, prev);
  F.gout = ''; $('note').value = ''; renderAll();
}

/* =====================================================================
   6. Moteur de conseils
   ===================================================================== */
function analyze(shot, prev) {
  const roast = roastOf(shot), P = profile(roast);
  const d = shot.dose, y = shot.tasse, t = shot.temps, c = shot.clics, R = y / d;
  const targetY = Math.round(d * P.target);
  const ratioOk = R >= P.lo && R <= P.hi;
  const choked = (t >= 30 && R < 1.2) || (t > 35 && R < 1.5);
  const out = [];
  let grind = null; // conseil de mouture principal

  // Temps "équivalent" : si le poids est loin de la cible, on estime la durée qu'aurait eue le shot à la cible
  let tt = t, est = false;
  if (!choked && !ratioOk && y > 0) { tt = Math.round(PREINF + (t - PREINF) * targetY / y); est = true; }
  const when = est ? `≈ ${tt} s pour ${targetY} g (estimé d'après ${y} g en ${t} s)` : `${t} s`;

  if (choked) {
    const dl = R < 1 ? 4 : 3;
    grind = { prio: 1, param: 'la mouture', delta: dl, title: 'Shot étouffé',
      text: `Très peu de café en tasse (${y} g en ${t} s). Mouds nettement plus gros : +3 à +4 clics → essaie ${c + dl} clics.` };
  } else if (tt < 22) {
    const dl = tt < 18 ? -3 : -2;
    grind = { prio: 2, param: 'la mouture', delta: dl, title: `Trop rapide (${when})`,
      text: `Mouds plus fin : −2 à −3 clics → essaie ${c + dl} clics.` };
  } else if (tt < TIME_LO) {
    grind = { prio: 2, param: 'la mouture', delta: -1, title: `Un peu rapide (${when})`, text: `Mouds un poil plus fin : −1 clic → ${c - 1} clics.` };
  } else if (tt > 35) {
    const dl = tt > 40 ? 3 : 2;
    grind = { prio: 2, param: 'la mouture', delta: dl, title: `Trop lent (${when})`, text: `Mouds plus gros : +2 à +3 clics → essaie ${c + dl} clics.` };
  } else if (tt > TIME_HI) {
    grind = { prio: 2, param: 'la mouture', delta: 1, title: `Un peu lent (${when})`, text: `Mouds un poil plus gros : +1 clic → ${c + 1} clics.` };
  }
  if (grind && P.light && grind.delta < 0) grind.text += ' Café clair : il supporte bien une mouture fine.';
  if (grind && P.dark && grind.delta > 0) grind.text += ' Café foncé : il préfère une mouture plus grosse.';
  if (grind) out.push(grind);

  // Rendement (poids en tasse)
  let yieldAdv = null;
  if (!choked && R > P.hi) yieldAdv = { prio: 3, param: 'le rendement', title: `Ratio trop long (1:${fr(R)})`, text: `Arrête le shot plus tôt, vise ${targetY} g en tasse.` };
  if (!choked && R < P.lo) yieldAdv = { prio: 3, param: 'le rendement', title: `Ratio trop court (1:${fr(R)})`, text: `Laisse couler jusqu'à ${targetY} g.` };
  if (yieldAdv) out.push(yieldAdv);

  const timeOk = t >= TIME_LO && t <= TIME_HI;
  // Goût
  if (shot.gout && norm(shot.gout) === 'acide') {
    if (timeOk && ratioOk) out.push({ prio: 4, param: 'la température', title: 'Acide alors que temps et ratio sont bons',
      text: 'Piste température : la Gaggia n’est pas assez chaude. Laisse-la chauffer 15–20 min porte-filtre en place, fais un flush, puis lance le shot dès qu’elle a fini de chauffer (voyant).' });
    else if (grind && grind.delta < 0) grind.text += ' Ça corrigera aussi l’acidité.';
    else if (yieldAdv && R < P.lo) yieldAdv.text += ' Ça réduira aussi l’acidité.';
    else if (!grind && !yieldAdv) {
      const longY = P.light ? Math.round(d * 2.4) : targetY + 2;
      out.push({ prio: 4, param: 'la mouture', delta: -1, title: 'Acide = sous-extrait',
        text: `Mouds 1 clic plus fin (${c - 1} clics), ou sinon allonge le rendement à ${longY} g.${P.light ? ' Café clair : 1:2,3–2,5 est tout à fait acceptable.' : ''}` });
    }
  }
  if (shot.gout && norm(shot.gout) === 'amer') {
    if (timeOk && ratioOk) out.push({ prio: 4, param: 'la température', title: 'Amer alors que temps et ratio sont bons',
      text: 'Piste température trop haute, surtout juste après la vapeur : purge longuement (10–15 s, jusqu’à ce que l’eau ne crachote plus) et attends 1 min avant le shot.' });
    else if (grind && grind.delta > 0) grind.text += ' Ça corrigera aussi l’amertume.';
    else if (yieldAdv && R > P.hi) yieldAdv.text += ' Ça réduira aussi l’amertume.';
    else if (!grind && !yieldAdv) {
      const shortY = P.dark ? Math.round(d * 1.8) : targetY - 2;
      out.push({ prio: 4, param: 'la mouture', delta: 1, title: 'Amer = sur-extrait',
        text: `Mouds 1 clic plus gros (${c + 1} clics), ou sinon raccourcis le rendement à ${shortY} g.${P.dark ? ' Café foncé : vise 1:1,8–2,0.' : ''}` });
    }
  }

  // Régularité : même réglage, temps très différents → préparation du gâteau
  const eq = (s) => { const r = ratioOf(s); return r >= P.lo && r <= P.hi ? s.temps : Math.round(PREINF + (s.temps - PREINF) * targetY / s.tasse); };
  const same = prev.filter((s) => s.clics === c && Math.abs(s.dose - d) <= 0.3 && s.tasse > 0 && !((s.temps >= 30 && ratioOf(s) < 1.2))).slice(-2);
  let inconsistent = false;
  if (same.length && !choked) {
    const times = [...same.map(eq), tt];
    if (Math.max(...times) - Math.min(...times) >= 6) {
      inconsistent = true;
      out.push({ prio: 5, param: 'la préparation', title: 'Résultats irréguliers au même réglage',
        text: `À ${c} clics tu as eu ${times.map((x) => x + ' s').join(', ')} : piste préparation du gâteau (canalisation). WDT, distribution, tassage bien à plat.` });
    }
  }

  const success = !choked && timeOk && ratioOk && (!shot.gout || norm(shot.gout) === 'equilibre');
  if (success) out.unshift({ prio: 0, param: null, title: 'Shot dans la cible',
    text: shot.gout ? 'Équilibré et dans la cible : garde exactement cette recette.' : 'Goûte-le : s’il est équilibré, garde exactement cette recette.' });

  out.sort((a, b) => a.prio - b.prio);
  const list = out.slice(0, 3);
  const main = list.find((a) => a.param);
  const recipe = { dose: d, clics: c, tasse: targetY };
  if (main && main.delta) recipe.clics = clamp(c + main.delta, 0, 180);
  return { R, P, ratioOk, timeOk, tt, est, list, main, recipe, inconsistent, yieldOff: !!yieldAdv };
}

const TIPS = [
  'Gaggia : laisse-la chauffer 15–20 min avec le porte-filtre en place.',
  'Gaggia : fais un court flush (2–3 s) juste avant le shot.',
  'Après la vapeur : purge longuement avant un nouveau shot, sinon l’eau est trop chaude.',
  'Préparation : WDT (aiguilles) pour casser les mottes avant de tasser.',
  'Préparation : tasse bien à plat, un gâteau penché favorise la canalisation.',
  'Préparation : tasse et porte-filtre chauds avant de lancer le shot.',
  'Café : idéalement entre 7 et 30 jours après la torréfaction.',
];
function pickTip(shot, a) {
  const c = cafeByName(shot?.cafe);
  if (c?.date) {
    const age = Math.floor((Date.now() - new Date(c.date + 'T12:00')) / 864e5);
    if (age >= 0 && age < 7) return `Café torréfié il y a ${age} jour${age > 1 ? 's' : ''} : encore un peu jeune, il sera meilleur à partir de 7 jours.`;
    if (age > 30) return `Café torréfié il y a ${age} jours : il s’évente, mouds un peu plus fin. Idéal : 7 à 30 jours.`;
  }
  if (a && norm(shot.gout) === 'amer') return TIPS[2];
  if (a && a.inconsistent) return TIPS[3];
  S.tipIdx = ((S.tipIdx || 0) + 1) % TIPS.length; save('settings', S);
  return TIPS[S.tipIdx];
}

function gauge(v, min, max, lo, hi, ok) {
  const p = (x) => clamp((x - min) / (max - min) * 100, 0, 100);
  return `<div class="gauge"><div class="zone" style="left:${p(lo)}%;width:${p(hi) - p(lo)}%"></div>
    <div class="mark ${ok ? 'ok' : 'warn'}" style="left:${p(v)}%"></div></div>`;
}

function showResult(shot, prev) {
  const a = analyze(shot, prev);
  const P = a.P, R = a.R;
  const rStat = a.ratioOk ? '<span class="status ok">✓ Dans la cible</span>'
    : `<span class="status warn">${R > P.hi ? '▲ Trop long' : '▼ Trop court'}</span>`;
  const tStat = a.timeOk ? '<span class="status ok">✓ Dans la cible</span>'
    : `<span class="status warn">${shot.temps > TIME_HI ? '▲ Trop lent' : '▼ Trop rapide'}</span>`;
  const only = a.main
    ? `Ne change qu’UN paramètre au prochain shot : ${a.main.param}.${a.main.param === 'la mouture' && a.yieldOff ? ` Garde la dose à ${fr(shot.dose)} g et vise ${a.recipe.tasse} g.` : ''}`
    : 'Ne change rien : refais la même recette.';
  const rec = a.recipe;
  $('resultInner').innerHTML = `
    <h2>${esc(shot.cafe)}</h2>
    <section class="card">
      <div class="metric"><div><div class="muted small">Ratio</div><div class="v">1:${fr(R)}</div></div>${rStat}</div>
      ${gauge(R, 1, 3, P.lo, P.hi, a.ratioOk)}
      <div class="gscale"><span>1:1</span><span>cible 1:${fr(P.lo)}–${fr(P.hi)}</span><span>1:3</span></div>
      <div class="metric" style="margin-top:14px"><div><div class="muted small">Temps</div><div class="v">${shot.temps} s</div></div>${tStat}</div>
      ${gauge(shot.temps, 15, 45, TIME_LO, TIME_HI, a.timeOk)}
      <div class="gscale"><span>15 s</span><span>cible 25–30 s</span><span>45 s</span></div>
    </section>
    <div class="onlyone">${only}</div>
    <section class="card"><p class="label">Conseils</p>
      <ol class="advice">${a.list.map((x) => `<li><b>${esc(x.title)}</b>${esc(x.text)}${x.param ? `<div class="tag">Paramètre : ${x.param}</div>` : ''}</li>`).join('')}</ol>
    </section>
    <section class="card"><p class="label">Prochaine recette</p>
      <div class="recipe">
        <div><b>${fr(rec.dose)} g</b><span>dose</span></div>
        <div><b>${rec.clics}</b><span>clics (${tours(rec.clics)})</span></div>
        <div><b>${rec.tasse} g</b><span>en 25–30 s</span></div>
      </div>
      <button class="primary" id="applyNext">Appliquer au prochain shot</button>
    </section>
    <button class="secondary" id="closeResult">Fermer</button>
    <p class="tip">${esc(pickTip(shot, a))}</p>`;
  $('applyNext').onclick = () => {
    next[shot.cafe] = { dose: rec.dose, clics: rec.clics, tasse: rec.tasse }; save('next', next);
    prefill(shot.cafe); closeResult(); renderAll(); toast('Recette appliquée');
  };
  $('closeResult').onclick = closeResult;
  $('result').classList.remove('hidden'); $('result').scrollTop = 0;
  document.body.style.overflow = 'hidden';
}
function closeResult() { $('result').classList.add('hidden'); document.body.style.overflow = ''; window.scrollTo(0, 0); }

/* =====================================================================
   7. Accueil : meilleur réglage + mini-stats par café
   ===================================================================== */
function bestOf(list) {
  const dist = (s) => Math.abs(ratioOf(s) - 2);
  const bal = list.filter((s) => norm(s.gout) === 'equilibre');
  const pool = bal.length ? bal : list.filter((s) => s.temps >= TIME_LO && s.temps <= TIME_HI && ratioOf(s) >= 1.5 && ratioOf(s) <= 2.6);
  return pool.sort((a, b) => dist(a) - dist(b))[0];
}
function spark(vals, lo, hi, band) {
  if (vals.length < 2) return '<svg viewBox="0 0 100 34"></svg>';
  const min = Math.min(lo, ...vals), max = Math.max(hi, ...vals), span = max - min || 1;
  const x = (i) => 4 + i * 92 / (vals.length - 1), y = (v) => 30 - (v - min) / span * 26;
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const b = band ? `<rect x="0" width="100" y="${y(band[1]).toFixed(1)}" height="${(y(band[0]) - y(band[1])).toFixed(1)}" fill="var(--zone)" opacity=".7"/>` : '';
  return `<svg viewBox="0 0 100 34" preserveAspectRatio="none">${b}
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function renderStats() {
  const html = cafes.map((c) => {
    const list = shotsOf(c.nom);
    const n = list.length, ok = list.filter(inTarget).length;
    const b = bestOf(list.slice());
    const last = list.slice(-15);
    const P = profile(c.torrefaction);
    return `<button class="best ${c.nom === F.cafe ? 'sel' : ''}" data-best="${esc(c.nom)}">
      <h3>${esc(c.nom)}</h3>
      <div class="muted small">Meilleur réglage${b ? ' · touche pour l’appliquer' : ''}</div>
      <div class="reco">${b ? `<b>${b.clics} clics</b> · ${fr(b.dose)} g → ${Math.round(b.tasse)} g · ${b.temps} s` : '<span class="muted">Pas encore de shot de référence</span>'}</div>
      <div class="stats"><span>${n} shot${n > 1 ? 's' : ''}</span><span>${n ? Math.round(ok / n * 100) : 0} % dans la cible</span></div>
      <div class="sparks">
        <div class="spark"><div class="t"><span>Clics</span><span>${last.at(-1)?.clics ?? ''}</span></div>${spark(last.map((s) => s.clics), last.at(-1)?.clics - 2 || 0, last.at(-1)?.clics + 2 || 1)}</div>
        <div class="spark"><div class="t"><span>Ratio</span><span>${last.length ? '1:' + fr(ratioOf(last.at(-1))) : ''}</span></div>${spark(last.map((s) => clamp(ratioOf(s), 0.5, 4)), 1.5, 2.5, [P.lo, P.hi])}</div>
      </div></button>`;
  }).join('');
  $('carousel').innerHTML = html;
}

/* =====================================================================
   8. Historique
   ===================================================================== */
let histFilter = '';
function renderHistory() {
  const names = [...new Set([...cafes.map((c) => c.nom), ...shots.map((s) => s.cafe)])];
  $('histFilter').innerHTML = [['', 'Tous'], ...names.map((n) => [n, n])].map(([v, l]) =>
    `<button class="chip ${histFilter === v ? 'sel' : ''}" data-filter="${esc(v)}">${esc(l)}</button>`).join('');
  const list = shots.filter((s) => !histFilter || s.cafe === histFilter).sort((a, b) => sortKey(b).localeCompare(sortKey(a)));
  const pendingIds = new Set(queue.map((o) => String(o.id)));
  $('histList').innerHTML = list.length ? list.map((s) => {
    const R = ratioOf(s), ok = inTarget(s);
    const g = goutLabel[norm(s.gout).replace(/\s/g, '')] || s.gout;
    return `<div class="card shot">
      <div class="top"><b>${esc(s.cafe)}</b><span class="muted small">${dateFr(s.date)} · ${esc(s.heure)}${isTmp(s.id) || pendingIds.has(String(s.id)) ? ' · ⏳' : ''}</span></div>
      <div class="vals"><span><span class="dot ${ok ? 'ok' : 'warn'}"></span>1:${fr(R)}</span><span>${fr(s.dose)} g → ${Math.round(s.tasse)} g</span>
        <span>${s.temps} s</span><span>${s.clics} clics</span>${g ? `<span>${esc(g)}</span>` : ''}</div>
      ${s.note ? `<div class="note">${esc(s.note)}</div>` : ''}
      <div class="acts"><button data-edit="${esc(s.id)}">Modifier</button><button class="danger" data-del="${esc(s.id)}">Supprimer</button></div>
    </div>`;
  }).join('') : '<div class="empty">Aucun shot pour l’instant.</div>';
}

function startEdit(id) {
  const s = shots.find((x) => String(x.id) === String(id)); if (!s) return;
  editingId = s.id;
  if (!cafeByName(s.cafe)) { cafes.push({ nom: s.cafe, torrefaction: s.torrefaction || 'moyenne', date: '' }); qCafes(); saveAll(); }
  F.cafe = s.cafe; F.dose = Math.round(s.dose * 10); F.clics = s.clics; F.temps = s.temps; F.tasse = Math.round(s.tasse);
  F.gout = Object.keys(goutLabel).includes(norm(s.gout)) ? { acide: 'acide', equilibre: 'équilibré', amer: 'amer' }[norm(s.gout)] : '';
  $('note').value = s.note || '';
  $('editWhen').textContent = `du ${dateFr(s.date)} à ${s.heure}`;
  showTab('shot'); renderAll(); window.scrollTo(0, 0);
}
async function delShot(id) {
  const s = shots.find((x) => String(x.id) === String(id)); if (!s) return;
  if (!(await ask({ title: 'Supprimer ce shot ?', body: `${esc(s.cafe)} · ${dateFr(s.date)} ${esc(s.heure)}`, ok: 'Supprimer', danger: true }))) return;
  shots = shots.filter((x) => x !== s); qDelete(s.id); saveAll(); renderAll(); syncNow();
}

function exportCsv() {
  const q = (v) => { const s = String(v ?? ''); return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = shots.slice().sort((a, b) => sortKey(a).localeCompare(sortKey(b))).map((s) => toRow(s).map(q).join(','));
  const csv = '﻿' + [HEADER.join(','), ...rows].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `espresso-shots-${today()}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* =====================================================================
   9. Google : connexion, choix de la feuille, lecture/écriture Sheets
   ===================================================================== */
const configured = () => !!(CLIENT_ID && API_KEY);
let token = load('token', null);
const validToken = () => (token && token.exp > Date.now() + 60e3 ? token.t : null);
let tokenClient = null, tokenWaiter = null;

function requestToken() {
  return new Promise((res, rej) => {
    if (!window.google?.accounts?.oauth2) return rej(new Error('Google pas encore chargé, réessaie dans un instant.'));
    if (!tokenClient) tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID, scope: SCOPE,
      callback: (r) => { const w = tokenWaiter; tokenWaiter = null; if (r.error) w?.rej(r); else { token = { t: r.access_token, exp: Date.now() + r.expires_in * 1000 }; save('token', token); S.consented = true; save('settings', S); w?.res(token.t); } },
      error_callback: (e) => { const w = tokenWaiter; tokenWaiter = null; w?.rej(e); },
    });
    tokenWaiter = { res, rej };
    tokenClient.requestAccessToken({ prompt: S.consented ? '' : 'consent' });
  });
}

function pickSheet() {
  return new Promise((res, rej) => {
    gapi.load('picker', () => {
      const view = new google.picker.DocsView(google.picker.ViewId.SPREADSHEETS).setMode(google.picker.DocsViewMode.LIST).setQuery('Espresso Shots');
      new google.picker.PickerBuilder()
        .addView(view)
        .setOAuthToken(validToken())
        .setDeveloperKey(API_KEY)
        .setAppId(CLIENT_ID.split('-')[0]) // numéro du projet = début du CLIENT_ID
        .setLocale('fr')
        .setTitle('Choisis ta feuille « Espresso Shots »')
        .setCallback((d) => {
          if (d.action === google.picker.Action.PICKED) res(d.docs[0]);
          else if (d.action === google.picker.Action.CANCEL) rej(new Error('cancel'));
        })
        .build().setVisible(true);
    });
  });
}

class AuthError extends Error {}
async function api(url, method = 'GET', body) {
  const t = validToken(); if (!t) throw new AuthError();
  const r = await fetch(url, { method, headers: { Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { token = null; save('token', null); throw new AuthError(); }
  if (!r.ok) throw new Error(`Google Sheets ${r.status} : ${(await r.text()).slice(0, 200)}`);
  return r.json();
}
const A = (tab, range) => encodeURIComponent(`'${tab.replace(/'/g, "''")}'!${range}`);
const sheetUrl = (p) => `${SHEETS}/${S.sheetId}${p}`;

// Valeurs écrites "telles quelles" : date AAAA-MM-JJ, décimales avec un point
function toRow(s) {
  const id = isTmp(s.id) ? '' : Number(s.id) || s.id;
  return [id, s.date, s.heure, s.cafe, s.torrefaction || '', String(+Number(s.dose).toFixed(1)), Math.round(s.tasse),
    ratioOf(s).toFixed(2), s.temps, s.clics, s.gout || '', s.note || ''];
}
const num = (v) => (typeof v === 'number' ? v : parseFloat(String(v ?? '').replace(',', '.').replace(/\s/g, '')));
function parseDate(v) {
  const s = String(v ?? '').trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m = s.match(/^(\d{1,2})[/.](\d{1,2})[/.](\d{4})/); if (m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
  return s;
}
function parseRow(r) {
  const [id, date, heure, cafe, torr, dose, tasse, , temps, clics, gout, note] = r;
  if (!cafe || !(num(dose) >= 0)) return null;
  const h = String(heure ?? '').match(/(\d{1,2}):(\d{2})/);
  return { id: String(id ?? ''), date: parseDate(date), heure: h ? `${pad(h[1])}:${h[2]}` : '', cafe: String(cafe).trim(),
    torrefaction: String(torr ?? '').trim(), dose: num(dose) || 0, tasse: num(tasse) || 0, temps: Math.round(num(temps) || 0),
    clics: Math.round(num(clics) || 0), gout: String(gout ?? '').trim(), note: String(note ?? '').trim() };
}

let meta = null; // { tab, sheetId } de l'onglet des shots
async function ensureMeta() {
  if (meta && meta.for === S.sheetId) return meta;
  const info = await api(sheetUrl('?fields=properties.title,sheets.properties(sheetId,title)'));
  const props = info.sheets.map((s) => s.properties);
  let shotsTab = props.find((p) => p.title.toLowerCase() !== CAFES_TAB);
  if (!shotsTab) {
    const r = await api(sheetUrl(':batchUpdate'), 'POST', { requests: [{ addSheet: { properties: { title: 'shots' } } }] });
    shotsTab = r.replies[0].addSheet.properties;
  }
  if (!props.some((p) => p.title.toLowerCase() === CAFES_TAB)) {
    await api(sheetUrl(':batchUpdate'), 'POST', { requests: [{ addSheet: { properties: { title: CAFES_TAB } } }] });
    await writeCafes();
  }
  const head = await api(sheetUrl(`/values/${A(shotsTab.title, 'A1:L1')}`));
  if (!head.values?.length) await api(sheetUrl(`/values/${A(shotsTab.title, 'A1:L1')}?valueInputOption=RAW`), 'PUT', { values: [HEADER] });
  S.sheetName = info.properties.title; save('settings', S);
  meta = { for: S.sheetId, tab: shotsTab.title, sid: shotsTab.sheetId };
  return meta;
}
async function writeCafes() {
  await api(sheetUrl(`/values/${A(CAFES_TAB, 'A2:C1000')}:clear`), 'POST', {});
  const values = [CAFES_HEADER, ...cafes.map((c) => [c.nom, c.torrefaction || '', c.date || ''])];
  await api(sheetUrl(`/values/${A(CAFES_TAB, `A1:C${values.length}`)}?valueInputOption=RAW`), 'PUT', { values });
}
async function findRow(id) {
  const r = await api(sheetUrl(`/values/${A(meta.tab, 'A:A')}`));
  const i = (r.values || []).findIndex((v) => String(v[0] ?? '').trim() === String(id));
  return i < 0 ? 0 : i + 1;
}

// File d'attente : chaque modification est envoyée dans l'ordre dès que possible
const saveQ = () => save('queue', queue);
function qAdd(id) { queue.push({ op: 'add', id }); saveQ(); }
function qUpdate(id) { if (isTmp(id) || queue.some((o) => o.op === 'update' && o.id === id)) return; queue.push({ op: 'update', id }); saveQ(); }
function qDelete(id) {
  if (isTmp(id)) queue = queue.filter((o) => o.id !== id);
  else { queue = queue.filter((o) => !(o.op === 'update' && o.id === id)); queue.push({ op: 'delete', id }); }
  saveQ();
}
function qCafes() { queue = queue.filter((o) => o.op !== 'cafes'); queue.push({ op: 'cafes' }); saveQ(); }

async function execOp(o) {
  if (o.op === 'cafes') return writeCafes();
  if (o.op === 'add') {
    const s = shots.find((x) => x.id === o.id); if (!s) return;
    const col = await api(sheetUrl(`/values/${A(meta.tab, 'A2:A')}`));
    const ids = (col.values || []).map((v) => parseInt(v[0], 10)).filter((n) => !isNaN(n));
    const newId = String((ids.length ? Math.max(...ids) : 0) + 1);
    await api(sheetUrl(`/values/${A(meta.tab, 'A1')}:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`), 'POST', { values: [toRow({ ...s, id: newId })] });
    s.id = newId; // l'id définitif n'est attribué qu'une fois la ligne bien écrite
    save('shots', shots);
    return;
  }
  if (o.op === 'update') {
    const s = shots.find((x) => x.id === o.id); if (!s) return;
    const row = await findRow(s.id);
    if (row) await api(sheetUrl(`/values/${A(meta.tab, `A${row}:L${row}`)}?valueInputOption=RAW`), 'PUT', { values: [toRow(s)] });
    return;
  }
  if (o.op === 'delete') {
    const row = await findRow(o.id);
    if (row) await api(sheetUrl(':batchUpdate'), 'POST', { requests: [{ deleteDimension: { range: { sheetId: meta.sid, dimension: 'ROWS', startIndex: row - 1, endIndex: row } } }] });
  }
}

async function pullAll() {
  const [sv, cv] = await Promise.all([
    api(sheetUrl(`/values/${A(meta.tab, 'A2:L')}`)),
    api(sheetUrl(`/values/${A(CAFES_TAB, 'A2:C')}`)),
  ]);
  shots = (sv.values || []).map(parseRow).filter(Boolean);
  const remote = (cv.values || []).filter((r) => r[0]).map((r) => ({ nom: String(r[0]).trim(), torrefaction: String(r[1] ?? '').trim(), date: parseDate(r[2]) }));
  if (remote.length) cafes = remote; else await writeCafes();
  if (!cafeByName(F.cafe) && !editingId) prefill(cafes[0]?.nom || '');
  saveAll();
}

let syncing = false, status = { k: 'idle' };
async function sync() {
  if (syncing) return;
  if (!configured()) return setStatus('local');
  if (!S.sheetId) return setStatus('nosheet');
  if (!validToken()) return setStatus('auth');
  if (!navigator.onLine) return setStatus('offline');
  syncing = true; setStatus('syncing');
  try {
    await ensureMeta();
    while (queue.length) { await execOp(queue[0]); queue.shift(); saveQ(); }
    await pullAll();
    setStatus('ok');
  } catch (e) {
    if (e instanceof AuthError) setStatus('auth');
    else if (e instanceof TypeError) setStatus('offline'); // pas de réseau
    else { console.error(e); setStatus('error', e.message); }
  } finally { syncing = false; renderAll(); }
}
// Appelé depuis un geste du doigt : si la connexion Google a expiré, on la redemande
function syncNow() {
  if (configured() && S.sheetId && !validToken() && navigator.onLine) {
    requestToken().then(sync).catch(() => setStatus('auth'));
  } else sync();
}
let syncTimer; const syncSoon = () => { clearTimeout(syncTimer); syncTimer = setTimeout(sync, 400); };

async function connectFlow() {
  try {
    if (!validToken()) await requestToken();
    const doc = await pickSheet();
    S.sheetId = doc.id; S.sheetName = doc.name; meta = null; save('settings', S);
    toast(`Feuille « ${doc.name} » connectée`);
    await sync();
  } catch (e) {
    if (e?.message !== 'cancel') { console.error(e); toast('Connexion impossible : ' + (e?.message || e?.type || 'erreur')); }
    renderStatus();
  }
}

function setStatus(k, msg) { status = { k, msg }; renderStatus(); }
function renderStatus() {
  const n = queue.length, p = $('syncPill');
  const st = !configured() ? 'local' : !S.sheetId ? 'nosheet' : status.k;
  const map = {
    local: ['Local', 'wait'], nosheet: ['Connecter', 'wait'], auth: [n ? `Se connecter · ${n} en attente` : 'Se connecter', 'wait'],
    offline: [n ? `⏳ ${n} en attente` : 'Hors-ligne', 'wait'], syncing: ['Synchro…', ''], ok: [n ? `⏳ ${n} en attente` : '✓ À jour', n ? 'wait' : 'ok'],
    error: ['⚠ Erreur', 'err'], idle: [n ? `⏳ ${n} en attente` : '…', n ? 'wait' : ''],
  };
  const [txt, cls] = map[st] || map.idle;
  p.textContent = txt; p.className = 'pill ' + cls;
  const b = $('setupBanner');
  if (!configured()) {
    b.innerHTML = '<b>Mode local.</b> Tes shots restent sur ce téléphone. Renseigne CLIENT_ID et API_KEY dans index.html pour les envoyer dans Google Sheets (voir le README).';
    b.classList.remove('hidden');
  } else if (!S.sheetId) {
    b.innerHTML = '<b>Connecte ta feuille « Espresso Shots »</b> pour sauvegarder tes shots et retrouver ton historique.<button class="secondary" id="connectBtn">Se connecter à Google</button>';
    b.classList.remove('hidden'); $('connectBtn').onclick = connectFlow;
  } else b.classList.add('hidden');
}

async function onPill() {
  if (!configured()) return ask({ title: 'Mode local', body: 'Les identifiants Google ne sont pas encore renseignés dans index.html. Suis le README pour créer CLIENT_ID et API_KEY.', ok: 'OK', cancel: '' });
  if (!S.sheetId) return connectFlow();
  if (status.k === 'error' && !(await ask({ title: 'Erreur de synchronisation', body: esc(status.msg), ok: 'Réessayer' }))) return;
  syncNow();
}

async function openMenu() {
  const d = $('dlg');
  d.innerHTML = `<h3>Réglages</h3>
    <p class="small muted">Feuille : ${S.sheetId ? esc(S.sheetName || S.sheetId) : 'aucune'}<br>Shots enregistrés : ${shots.length} · en attente : ${queue.length}</p>
    <div style="display:grid;gap:8px">
      ${configured() ? `<button class="secondary" id="mSync">Synchroniser maintenant</button>
      <button class="secondary" id="mPick">${S.sheetId ? 'Changer de feuille' : 'Choisir la feuille'}</button>` : ''}
      ${validToken() ? '<button class="secondary" id="mOut">Se déconnecter de Google</button>' : ''}
      <button class="secondary" id="mClose">Fermer</button>
    </div>`;
  const on = (id, fn) => { const b = $(id); if (b) b.onclick = () => { d.close(); fn(); }; };
  on('mSync', syncNow); on('mPick', connectFlow); on('mClose', () => {});
  on('mOut', () => { try { google.accounts.oauth2.revoke(token.t); } catch {} token = null; save('token', null); S.consented = false; save('settings', S); setStatus('auth'); });
  d.showModal();
}

/* =====================================================================
   10. Navigation et démarrage
   ===================================================================== */
function showTab(t) {
  $('tabShot').classList.toggle('hidden', t !== 'shot');
  $('tabHist').classList.toggle('hidden', t !== 'hist');
  $('tabBtnShot').classList.toggle('sel', t === 'shot');
  $('tabBtnHist').classList.toggle('sel', t === 'hist');
  window.scrollTo(0, 0);
}
function renderAll() { renderForm(); renderStats(); renderHistory(); renderStatus(); }

document.querySelectorAll('[data-step]').forEach((b) => {
  const [f, d] = b.dataset.step.split(':'); bindRepeat(b, () => step(f, +d));
});
$('tempsRange').addEventListener('input', (e) => { F.temps = +e.target.value; renderForm(); });
$('cafeChips').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'addCafe') return cafeDialog(null);
  if (editingId) { F.cafe = b.dataset.cafe; renderAll(); return; }
  prefill(b.dataset.cafe); renderAll();
});
$('editCafeBtn').onclick = () => cafeByName(F.cafe) && cafeDialog(cafeByName(F.cafe));
$('tasteBtns').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; F.gout = F.gout === b.dataset.gout ? '' : b.dataset.gout; renderForm(); });
$('saveBtn').onclick = onSave;
$('cancelEdit').onclick = () => { editingId = null; prefill(F.cafe); renderAll(); };
$('carousel').addEventListener('click', (e) => {
  const b = e.target.closest('[data-best]'); if (!b) return;
  const name = b.dataset.best, best = bestOf(shotsOf(name));
  editingId = null; prefill(name);
  if (best) { F.dose = Math.round(best.dose * 10); F.clics = best.clics; F.tasse = Math.round(best.tasse); F.temps = best.temps; toast('Meilleur réglage appliqué'); }
  renderAll();
});
$('histFilter').addEventListener('click', (e) => { const b = e.target.closest('[data-filter]'); if (!b) return; histFilter = b.dataset.filter; renderHistory(); });
$('histList').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.edit) startEdit(b.dataset.edit);
  if (b.dataset.del) delShot(b.dataset.del);
});
$('csvBtn').onclick = exportCsv;
$('tabBtnShot').onclick = () => showTab('shot');
$('tabBtnHist').onclick = () => showTab('hist');
$('syncPill').onclick = onPill;
$('menuBtn').onclick = openMenu;
window.addEventListener('online', sync);
window.addEventListener('offline', () => setStatus('offline'));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(); });

prefill(cafeByName(S.cafe) ? S.cafe : cafes[0]?.nom || '');
$('formTip').textContent = pickTip(null, null);
renderAll();
sync();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js');
</script>
